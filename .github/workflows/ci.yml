name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck shell scripts
        run: shellcheck install.sh uninstall.sh scripts/next-version.sh scripts/verify-package.sh

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Core dependencies stay on the allowlist, GUI never imports the Core
        run: python3 scripts/check-boundaries.py

  gui-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PyQt6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyqt6
      # ubuntu-latest ships PyQt6 6.6.1 bound against Qt 6.4.2, which is the
      # same Qt floor Debian 12 has. Exercising the floor is the point: the
      # supported spread runs to Qt 6.11 on Fedora and Arch, so testing only
      # the newest would let a 6.5+ API slip in and break the oldest target.
      - name: Report the Qt version actually under test
        run: |
          python3 -c "from PyQt6.QtCore import QT_VERSION_STR, PYQT_VERSION_STR; \
            print(f'PyQt6 {PYQT_VERSION_STR} / Qt {QT_VERSION_STR}')"
      # The interface is a client of the Core: two of its test classes execute
      # the real binary, so there has to be one to execute.
      - name: Build the Core the interface talks to
        run: cargo build
      - name: GUI test suite, headless
        env:
          QT_QPA_PLATFORM: offscreen
          STEAMTRAIN_BIN: ${{ github.workspace }}/target/debug/steamtrain
        run: python3 -m unittest discover -s tests -v

  # Steam's Linux client is x86_64 only, so this is the only target worth
  # packaging: an arm64 build would ship a tool with no Steam to configure.
  packaging:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # musl-tools for the target C toolchain. Native, on a runner of the same
      # architecture, so there is no cross-compilation here and no need for
      # `cross` and its Docker requirement.
      - name: Install the musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: Build the static binary
        run: cargo build --release --target "$TARGET"
      - name: The shipped binary must need no interpreter or shared libraries
        run: |
          set -eu
          binary="target/$TARGET/release/steamtrain"
          file "$binary"
          # Either spelling is a fully static binary with no interpreter and
          # no shared libraries. The Core links no C code any more, so the musl
          # target produces static-pie rather than the plain static link a C
          # dependency used to force; both satisfy what this step is asserting.
          file "$binary" | grep -qE "static-pie linked|statically linked" \
            || { echo "not statically linked"; exit 1; }
      - name: Install nfpm
        run: |
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin nfpm
        env:
          NFPM_VERSION: 2.47.0
      - name: Validate desktop entry
        run: |
          sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate packaging/steamtrain.desktop
      - name: Build the packages
        run: |
          set -eu
          mkdir -p dist/stage
          STEAMTRAIN_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          export STEAMTRAIN_VERSION
          # nfpm does not expand environment variables inside contents.src, so
          # the binary is staged at the fixed path the config names.
          install -Dm755 "target/$TARGET/release/steamtrain" dist/stage/steamtrain
          for format in deb rpm; do
            nfpm package -f packaging/nfpm-core.yaml -p "$format" -t dist/
          done
          if [ -d steamtrain_gui ]; then
            for format in deb rpm; do
              nfpm package -f packaging/nfpm-gui.yaml -p "$format" -t dist/
            done
          else
            echo "::warning::steamtrain_gui/ is absent - the GUI package was NOT built or verified in this run"
          fi
          rm -rf dist/stage
          ls -l dist/
      - name: The Core package must declare no dependencies
        run: |
          set -eu
          depends=$(dpkg-deb -f dist/steamtrain_*_amd64.deb Depends || true)
          if [ -n "$depends" ]; then
            echo "Core package gained a dependency: $depends"; exit 1
          fi
          echo "Core package depends on nothing"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  install-smoke:
    needs: packaging
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            install: apt-get update -qq && apt-get install -y -qq /dist/steamtrain_*_amd64.deb
            remove: apt-get remove -y -qq steamtrain
          - image: ubuntu:24.04
            install: apt-get update -qq && apt-get install -y -qq /dist/steamtrain_*_amd64.deb
            remove: apt-get remove -y -qq steamtrain
          - image: fedora:latest
            install: dnf install -y -q /dist/steamtrain-[0-9]*.x86_64.rpm
            remove: dnf remove -y -q steamtrain
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Install, verify inert, run, remove
        run: |
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/scripts/verify-package.sh:/verify.sh:ro" \
            "${{ matrix.image }}" \
            sh /verify.sh "${{ matrix.install }}" "${{ matrix.remove }}"
