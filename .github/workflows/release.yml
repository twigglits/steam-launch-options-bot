name: Release

on:
  push:
    tags: ["v*"]
  # The Version workflow chains into this one by dispatching it on the new tag
  # (a tag pushed with GITHUB_TOKEN cannot trigger `on: push: tags` itself).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One job, because there is one target. Steam's Linux client is x86_64 only,
  # so an arm64 build would ship a tool with no Steam to configure; dropping it
  # removes the build matrix, and with it the artifact hand-off between jobs.
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Verify the ref is a v* tag that matches the package version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Release must run on a v* tag ref, got $GITHUB_REF (dispatch this workflow on a tag)"; exit 1 ;;
          esac
          # Both halves: the GUI refuses to open when its own constant differs
          # from the Core's, so a release that bumped only one is dead on
          # arrival for every desktop user. This is the last gate before
          # artifacts are published, and it must hold for hand-cut tags too.
          core=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          gui=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' steamtrain_gui/__init__.py | head -n1)
          for pair in "Cargo.toml:$core" "steamtrain_gui/__init__.py:$gui"; do
            name=${pair%%:*}; version=${pair#*:}
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $name version $version — releases must ship the version they claim"
              exit 1
            fi
          done

      - name: Run tests against the release ref
        run: cargo test

      # musl-tools for the target C toolchain, native on a runner of the same
      # architecture.
      - name: Install the musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Build the static binary
        run: cargo build --release --target "$TARGET"

      - name: The shipped binary must need no interpreter or shared libraries
        run: |
          # static-pie is what a pure-Rust musl build produces; plain "statically
          # linked" is what a C dependency used to force. Both are static.
          file "target/$TARGET/release/steamtrain" \
            | grep -qE "static-pie linked|statically linked"

      - name: Install nfpm
        run: |
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin nfpm
          nfpm --version
        env:
          NFPM_VERSION: 2.47.0

      - name: Build the packages
        run: |
          set -eu
          mkdir -p dist/stage
          STEAMTRAIN_VERSION="${GITHUB_REF_NAME#v}"
          export STEAMTRAIN_VERSION
          # nfpm does not expand environment variables inside contents.src, so
          # the binary is staged at the fixed path the config names.
          install -Dm755 "target/$TARGET/release/steamtrain" dist/stage/steamtrain
          for config in core gui; do
            for format in deb rpm; do
              nfpm package -f "packaging/nfpm-$config.yaml" -p "$format" -t dist/
            done
          done
          rm -rf dist/stage
          ls -l dist/

      - name: Ship the bare binary too, for distributions with no package
        run: |
          set -eu
          name="steamtrain-${GITHUB_REF_NAME}-linux-amd64"
          install -Dm755 "target/$TARGET/release/steamtrain" "$name/steamtrain"
          cp README.md LICENSE "$name/"
          tar -czf "dist/${name}.tar.gz" "$name"

      # No hand-rolled source tarball: GitHub attaches "Source code (tar.gz)"
      # and "(zip)" to every release already.
      - name: Checksums for every artifact
        run: |
          cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: create only if it doesn't already exist (safe to re-run).
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" --clobber dist/*
