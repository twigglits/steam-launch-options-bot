# GUI package: the settings window.
#
# Separate from the Core so that CLI, headless and server users never pull in
# ~150MB of Qt, and so the licences stay separable: the Core is MIT with no
# runtime dependencies, while this package links PyQt6 and is therefore
# GPL-3.0.
#
# PyQt6 rather than PySide6 because PySide6 is absent from Ubuntu 24.04 LTS.
# The binding is named differently per family, hence the overrides.
#
#   nfpm package -f packaging/nfpm-gui.yaml -p deb -t dist/
name: steamtrain-gui
# Still pure Python, so still one artifact for every architecture. The Core it
# depends on is compiled and therefore per-arch; these two are versioned in
# lockstep but not built in it.
arch: all
platform: linux
version: ${STEAMTRAIN_VERSION}
section: games
priority: optional
maintainer: twigglits <twigglits@users.noreply.github.com>
vendor: twigglits
homepage: https://github.com/twigglits/steamtrain
license: GPL-3.0-or-later
description: |
  Desktop interface for steamtrain.
  Confirms what steamtrain detected about your machine, says whether the
  scheduled timer is actually running and lets you switch it on or off, shows
  whether Steam is currently blocking a write, and lists the launch options
  proposed for each installed game before anything is written.
  .
  One window and nothing else: no tray icon, no background process. Closing it
  quits. The systemd timer is the only thing that can run without it, and the
  window says so.

# The exact-version pin matters: the GUI speaks a versioned wire protocol to
# the Core, so a mismatched pair must fail at install time rather than at
# parse time.
depends:
  - steamtrain (= ${STEAMTRAIN_VERSION})
  - python3-pyqt6

overrides:
  rpm:
    depends:
      - steamtrain = ${STEAMTRAIN_VERSION}
      - python3-pyqt6

contents:
  # Owned explicitly so rpm removes them rather than leaving empty directories
  # behind (dpkg happens to clean up after itself, so this only shows up on
  # Fedora). Both levels are declared here now: the Core package is a single
  # binary and no longer creates /usr/lib/steamtrain.
  - dst: /usr/lib/steamtrain
    type: dir
  - dst: /usr/lib/steamtrain/steamtrain_gui
    type: dir

  # Globbed rather than copying the directory, so a stray __pycache__ from a
  # local test run can never end up inside a release artifact.
  - src: ./steamtrain_gui/*.py
    dst: /usr/lib/steamtrain/steamtrain_gui/

  - src: ./packaging/steamtrain-gui
    dst: /usr/bin/steamtrain-gui
    file_info:
      mode: 0755

  - src: ./packaging/steamtrain.desktop
    dst: /usr/share/applications/steamtrain.desktop
  - src: ./packaging/steamtrain.metainfo.xml
    dst: /usr/share/metainfo/io.github.twigglits.steamtrain.metainfo.xml

  - src: ./packaging/icons/steamtrain.svg
    dst: /usr/share/icons/hicolor/scalable/apps/steamtrain.svg
  - src: ./packaging/icons/16x16.png
    dst: /usr/share/icons/hicolor/16x16/apps/steamtrain.png
  - src: ./packaging/icons/22x22.png
    dst: /usr/share/icons/hicolor/22x22/apps/steamtrain.png
  - src: ./packaging/icons/24x24.png
    dst: /usr/share/icons/hicolor/24x24/apps/steamtrain.png
  - src: ./packaging/icons/32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/steamtrain.png
  - src: ./packaging/icons/48x48.png
    dst: /usr/share/icons/hicolor/48x48/apps/steamtrain.png
  - src: ./packaging/icons/64x64.png
    dst: /usr/share/icons/hicolor/64x64/apps/steamtrain.png
  - src: ./packaging/icons/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/steamtrain.png
  - src: ./packaging/icons/256x256.png
    dst: /usr/share/icons/hicolor/256x256/apps/steamtrain.png

  - src: ./packaging/LICENSE.gui
    dst: /usr/share/doc/steamtrain-gui/LICENSE
