# Core package: CLI and rule engine. One file in /usr/bin and nothing else
# executable — no units, because nothing schedules runs but the settings window
# in the steamtrain-gui package, and only while it is open.
#
# One config, every format. One variable drives it:
#
#   STEAMTRAIN_VERSION  the version being built
#
# The architecture is fixed at amd64 — Steam's Linux client is x86_64 only, so
# a build for anything else ships a tool with no Steam to configure. nfpm
# renders that as `_amd64.deb` and `.x86_64.rpm` per family.
#
# The binary is read from a fixed staging path rather than from
# target/<triple>/release, because nfpm does not expand environment variables
# inside `contents.src` globs - only in fields like `version`. The build stages
# it there first; see the recipe below.
#
# This package has no runtime dependency at all, and that is a hard constraint
# rather than a preference: it is what makes steamtrain installable and
# auditable everywhere, and what lets a headless or CLI-only user avoid pulling
# in Qt. The binary is statically linked against musl, so it is also not
# coupled to the glibc version of whatever machine built it - Debian 12 ships
# 2.36 and a current CI runner has 2.39.
#
#   cargo build --release --target x86_64-unknown-linux-musl
#   install -Dm755 target/x86_64-unknown-linux-musl/release/steamtrain \
#     dist/stage/steamtrain
#   STEAMTRAIN_VERSION=0.5.0 nfpm package -f packaging/nfpm-core.yaml -p deb -t dist/
name: steamtrain
arch: amd64
platform: linux
version: ${STEAMTRAIN_VERSION}
section: games
priority: optional
maintainer: twigglits <twigglits@users.noreply.github.com>
vendor: twigglits
homepage: https://github.com/twigglits/steamtrain
license: MIT
description: |
  Set hardware-appropriate Steam launch options for installed games.
  Scans the games you actually have on disk and generates conservative launch
  options for your own GPU, session type and helper tools, instead of copying
  options reported from someone else's hardware. Never overwrites an option
  you set yourself, never writes while Steam is running, backs up before every
  write, and can revert everything it did.
  .
  Removing this package does not clear launch options it already set. Run
  `steamtrain revert` first if you want them cleared.

contents:
  - src: ./dist/stage/steamtrain
    dst: /usr/bin/steamtrain
    file_info:
      mode: 0755

  - src: ./LICENSE
    dst: /usr/share/doc/steamtrain/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/steamtrain/README.md
